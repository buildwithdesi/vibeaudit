name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.display || matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    strategy:
      matrix:
        os: [ubuntu-latest]
        node-version: [18, 20, 22]
        include:
          - os: windows-latest
            node-version: 22
            display: Windows Node 22

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Verify source and regression coverage
        run: npm run verify

  protection-pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Provision the pinned pilot image
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, appendFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          const { image } = JSON.parse(readFileSync('scripts/pilot-image.json', 'utf8'));
          if (!/^node@sha256:[a-f0-9]{64}$/.test(image)) throw new Error('Invalid pilot image pin');
          execFileSync('docker', ['pull', image], { stdio: 'inherit', timeout: 180000 });
          appendFileSync(process.env.GITHUB_ENV, `VIBEGUARD_PILOT_IMAGE=${image}\n`);
          NODE
      - name: Exercise real containment and guard crash recovery
        run: npm run test:pilot
      - name: Retain pilot acceptance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: protection-pilot-${{ github.run_id }}
          path: reports/pilot-runtime.json
          if-no-files-found: error
          retention-days: 30

  vibeaudit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Self-scan with vibeaudit (strict)
        shell: bash
        # Apply this repository's reviewed self-scan scope, just as local verification does.
        # The independent pinned OSV job below supplies CI dependency coverage.
        run: npm run --silent audit:self -- --format json | tee vibeaudit-report.json

      - name: Upload vibeaudit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibeaudit-report-${{ github.run_id }}
          path: vibeaudit-report.json
          if-no-files-found: error
          retention-days: 90

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  osv:
    permissions:
      actions: read
      contents: read
      security-events: write
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67 # v2.5.1
    with:
      scan-args: |-
        --no-ignore
        -r
        ./
      upload-sarif: false
      fail-on-vuln: true

  publish:
    needs: [test, protection-pilot, vibeaudit, gitleaks, osv]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Verify release tag and main ancestry
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$tag_version" = "$package_version" || {
            echo "Tag v${tag_version} does not match package.json ${package_version}."
            exit 1
          }
          git fetch --no-tags origin main --depth=1
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo "Tagged commit is not the current origin/main commit."
            exit 1
          }

      - name: Install pinned Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Sign official agent skill and hash baseline
        shell: bash
        run: |
          npm run bundle:check
          cosign sign-blob --yes --bundle src/data/agent-skill.md.sigstore.json src/data/agent-skill.md
          cosign sign-blob --yes --bundle src/data/agent-skill-baseline.json.sigstore.json src/data/agent-skill-baseline.json

      - name: Verify publisher identity, digests, and transparency proofs
        run: node scripts/verify-agent-release-assets.js

      - name: Inspect the publish artifact without scripts
        run: npm pack --dry-run --json --ignore-scripts

      - name: Publish to npm
        run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
