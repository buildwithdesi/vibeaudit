name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    strategy:
      matrix:
        node-version: [18, 20, 22]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

  vibeaudit:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Self-scan with vibeaudit (strict)
        run: node bin/vibe-audit.js . --format json --strict | tee vibeaudit-report.json

      - name: Upload vibeaudit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibeaudit-report-${{ github.run_id }}
          path: vibeaudit-report.json
          retention-days: 90

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    needs: [test, vibeaudit, gitleaks]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: npm-publish
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Verify release tag and main ancestry
        shell: bash
        run: |
          package_version="$(node -p "require('./package.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          test "$tag_version" = "$package_version" || {
            echo "Tag v${tag_version} does not match package.json ${package_version}."
            exit 1
          }
          git fetch --no-tags origin main --depth=1
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA" || {
            echo "Tagged commit is not the current origin/main commit."
            exit 1
          }

      - name: Inspect the publish artifact without scripts
        run: npm pack --dry-run --json --ignore-scripts

      - name: Publish to npm
        run: npm publish --access public --provenance --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
