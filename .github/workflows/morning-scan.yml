name: "Morning Scan"

on:
  schedule:
    # 7:00 AM Central Time (UTC-5 / UTC-6 depending on DST)
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      top:
        description: "Number of repos to scan (0 = all)"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci --ignore-scripts

      - name: Run morning scan
        # free-credit (FCA-01 through FCA-11) is part of the default rule set,
        # so every repo in scripts/repos.json is checked daily. Findings do not
        # fail this job: run-morning-scan accepts exit 0 and exit 1.
        env:
          GITHUB_TOKEN: ${{ secrets.SCAN_TOKEN }}
          # Passed via env, not inlined into the script, so the dispatch input
          # cannot be interpreted as shell.
          TOP: ${{ github.event.inputs.top || '0' }}
        run: npm run scan:morning -- --top "$TOP"

      # Reports enumerate security findings across many repos, so they are NOT
      # committed to this public repo. They are retained only as a private
      # GitHub Actions artifact (visible to repo collaborators, not the public).
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-scan-${{ github.run_id }}
          path: reports/
          if-no-files-found: error
          retention-days: 90
