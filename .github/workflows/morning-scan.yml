name: "Morning Scan"

on:
  schedule:
    # 7:00 AM Central Time (UTC-5 / UTC-6 depending on DST)
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      top:
        description: "Number of repos to scan (0 = all)"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Run morning scan
        id: scan
        env:
          GITHUB_TOKEN: ${{ secrets.SCAN_TOKEN }}
          # Passed via env, not inlined into the script, so the dispatch input
          # cannot be interpreted as shell.
          TOP: ${{ github.event.inputs.top || '0' }}
        run: |
          set +e
          node scripts/morning-scan.js --top "$TOP" --format markdown
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # Reports enumerate security findings across many repos, so they are NOT
      # committed to this public repo. They are retained only as a private
      # GitHub Actions artifact (visible to repo collaborators, not the public).
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-scan-${{ github.run_id }}
          path: reports/
          retention-days: 90

      # Exit 1 means "findings" — reported, not failed on. Exit 2 means the scan
      # reached zero repos (revoked token, wrong scope, GitHub outage), which
      # must never pass as a green, clean-looking run.
      - name: Fail if the scan had no coverage
        if: steps.scan.outputs.exit_code == '2'
        run: |
          echo "::error::Morning scan reached 0 repos — no coverage. Check the SCAN_TOKEN scope."
          exit 1
