name: "Morning Scan"

on:
  schedule:
    # 7:00 AM Central Time (UTC-5 / UTC-6 depending on DST)
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      top:
        description: "Number of repos to scan (0 = all)"
        required: false
        default: "0"

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Run morning scan
        id: scan
        env:
          GITHUB_TOKEN: ${{ secrets.SCAN_TOKEN }}
          # Passed via env, not inlined into the script, so the dispatch input
          # cannot be interpreted as shell.
          TOP: ${{ github.event.inputs.top || '0' }}
        run: |
          set +e
          node scripts/morning-scan.js --top "$TOP" --format markdown
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      # Reports enumerate security findings across many repos, so they are NOT
      # committed to this public repo. They are retained only as a private
      # GitHub Actions artifact (visible to repo collaborators, not the public).
      - name: Upload report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: morning-scan-${{ github.run_id }}
          path: reports/
          retention-days: 90

      # The scan's exit contract: 0 = clean, 1 = findings, 2 = reached zero repos.
      # Only 0 and 1 mean the scan actually ran, and neither may be trusted on the
      # exit code alone:
      #
      #   - Exit 2 is a coverage outage (revoked token, wrong scope, GitHub down)
      #     and must never pass as a green, clean-looking run.
      #   - Node also exits 1 when the script dies *before* main() — a missing
      #     node_modules, a bad import, a syntax error. That is indistinguishable
      #     from "findings" by exit code, so a scan that never scanned anything
      #     used to render as a green run whose artifact held an empty reports/.
      #
      # So require the artifact the run claims to have produced: every path that
      # reaches the end of main() writes reports/morning-scan-<date>.md, including
      # the exit-2 path. No report means the script never got that far.
      - name: Verify the scan actually ran
        if: always() && steps.scan.conclusion != 'skipped'
        env:
          EXIT_CODE: ${{ steps.scan.outputs.exit_code }}
        run: |
          if [ "$EXIT_CODE" = "2" ]; then
            echo "::error::Morning scan reached 0 repos — no coverage. Check the SCAN_TOKEN scope."
            exit 1
          fi
          if [ "$EXIT_CODE" != "0" ] && [ "$EXIT_CODE" != "1" ]; then
            echo "::error::Morning scan exited $EXIT_CODE, which is not part of its exit contract. Treating as a failed run, not as findings."
            exit 1
          fi
          if ! ls reports/morning-scan-*.md >/dev/null 2>&1; then
            echo "::error::Morning scan exited $EXIT_CODE but wrote no report — it died before scanning anything. This is NOT a clean run."
            exit 1
          fi
